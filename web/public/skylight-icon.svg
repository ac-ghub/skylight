<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Skylight app icon: blue-chrome crescent moon and a small plane on black.
       Final settings from the icon builder: moon (44,52) r29, thickness 0.65,
       tilt -35°; plane (71,34) size 17.5 turned 55°; tint #A9C8F2, shine 130°,
       depth 0.2, glow 0.45. -->
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(130 0.5 0.5)">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#A9C8F2"/>
      <stop offset="0.48" stop-color="#8BA5CA"/>
      <stop offset="0.57" stop-color="#F4F8FF"/>
      <stop offset="0.8" stop-color="#9CB8E0"/>
      <stop offset="1" stop-color="#D4E4F9"/>
    </linearGradient>
    <mask id="shape">
      <circle cx="44" cy="52" r="29" fill="#FFFFFF"/>
      <circle cx="59.44" cy="41.19" r="24.94" fill="#000000"/>
      <path transform="translate(71 34) rotate(55) scale(0.42683) translate(-50 -49)" fill="#FFFFFF"
        d="M50 8 C54 8 56 14 56 22 L56 40 L88 56 L88 64 L56 56 L56 76 L66 84 L66 90 L50 86 L34 90 L34 84 L44 76 L44 56 L12 64 L12 56 L44 40 L44 22 C44 14 46 8 50 8 Z"/>
    </mask>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.85" flood-color="#AACDFF" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#050508"/>
  <g filter="url(#glow)">
    <rect width="100" height="100" fill="url(#chrome)" mask="url(#shape)"/>
  </g>
</svg>
